<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Flash Cards</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <h1>Flash Cards</h1>
        <div id="completion-modal" class="modal">
            <div class="modal-content">
                <h2>🎉 학습 완료!</h2>
                <p id="completion-message"></p>
                <button id="close-modal">다시 학습하기</button>
            </div>
        </div>
        <div id="flashcard-container">
            <div class="flashcard">
                <div class="front"></div>
                <div class="back">
                    <div class="back-text"></div>
                    <div class="overlay-controls">
                        <button class="control-btn correct-btn">
                            <img
                                src="images/check_btn-removebg.png"
                                alt="Correct"
                            />
                        </button>
                        <button class="control-btn incorrect-btn">
                            <img
                                src="images/false_btn-removebg.png"
                                alt="Incorrect"
                            />
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="progress-wrapper">
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
            <span id="progress">0 / 0</span>
        </div>
        <div class="controls">
            <select id="category-select">
                <option value="all">All</option>
                <option value="wrong">Wrong Answers Only</option>
                <option value="Japanese">Japanese</option>
                <option value="English">English</option>
            </select>
            <button id="shuffle-btn">Shuffle</button>
            <button id="prev-btn">Previous</button>
            <button id="next-btn">Next</button>
        </div>
        <script src="scripts.js"></script>
    </body>
</html>

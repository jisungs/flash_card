<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flash Card - Dashboard</title>
        <!-- Bootstrap 5 CSS 연결 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <!-- Navigation Bar -->
        <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
            <div class="container">
                <a class="navbar-brand" href="index.html">Jisung's FlashCard</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="index.html"> 홈</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="flash_card.html"> 학습하기</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="flash_card.html?mode=wrong">오답 노트</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">설정</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <main id="main-content">
            
            <section class="content-section text-center">
                <h1 class="section-title mb-4">Welcome Back! </h1>
                <p class="lead mb-5">오늘의 학습을 시작해 보세요. 꾸준한 학습이 실력을 만듭니다.</p>

                <div class="row g-4 mb-5 justify-content-center" style="max-width: 800px;">
                    <div class="col-md-4">
                        <a href="flash_card.html?mode=all" class="text-decoration-none">
                            <div class="card h-100 border-0 shadow-sm p-3 stat-card">
                                <div class="card-body">
                                    <h5 class="card-title text-muted">전체 단어</h5>
                                    <h2 class="card-text fw-bold text-success" id="stat-total">0</h2>
                                </div>
                            </div>
                        </a>
                    </div>
                    <div class="col-md-4">
                        <a href="flash_card.html?mode=known" class="text-decoration-none">
                            <div class="card h-100 border-0 shadow-sm p-3 stat-card">
                                <div class="card-body">
                                    <h5 class="card-title text-muted">마스터한 단어</h5>
                                    <h2 class="card-text fw-bold text-primary" id="stat-mastered">0</h2>
                                </div>
                            </div>
                        </a>
                    </div>
                    <div class="col-md-4">
                        <a href="flash_card.html?mode=wrong" class="text-decoration-none">
                            <div class="card h-100 border-0 shadow-sm p-3 stat-card">
                                <div class="card-body">
                                    <h5 class="card-title text-muted">복습 필요</h5>
                                    <h2 class="card-text fw-bold text-danger" id="stat-wrong">0</h2>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>

                <div class="mb-5 text-center" style="max-width: 400px; margin-left: auto; margin-right: auto;">
                    <label for="set-select" class="form-label fw-bold mb-2">학습할 단어 세트를 선택하세요</label>
                    <select id="set-select" class="form-select form-select-lg mb-3">
                        <option value="all">전체 세트 학습</option>
                        <!-- 세트 목록이 scripts.js에 의해 동적으로 추가됩니다 -->
                    </select>
                </div>

                <div class="d-grid gap-2 col-md-4 mx-auto">
                    <a href="flash_card.html" id="start-learn-btn" class="btn btn-success btn-lg py-3 shadow">
                         지금 바로 학습 시작하기
                    </a>
                </div>
            </section>
        </main>

        <script src="scripts.js"></script>
        <!-- Bootstrap 5 JS 연결 (햄버거 메뉴 작동 필수) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그아웃 - Flash Card</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="statics/styles.css">
    <link rel="stylesheet" href="statics/auth.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-card">
            <span class="auth-welcome-img">🌿</span>
            <h1>Flash Card</h1>
            <p class="auth-sub">안전하게 로그아웃 되었습니다.<br>학습하시느라 고생 많으셨어요!</p>

            <div class="auth-button-group">
                <button type="button" class="auth-btn auth-btn-primary" onclick="location.href='login.html'">로그인 페이지로 돌아가기</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그아웃 - Flash Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* 로그인/로그아웃 공통 디자인 유지 */
        body {
            justify-content: center;
            align-items: center;
        }

        .logout-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            animation: fadeInUp 0.6s ease-out;
        }

        .logout-card {
            background-color: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            border: 2px solid #c8e6c9;
        }

        .logout-card h1 {
            margin-top: 0;
            font-size: 2rem;
            font-weight: 800;
            color: #66bb6a;
            margin-bottom: 10px;
        }

        .logout-card p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .logout-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 30px;
        }

        .btn-back {
            background-color: #66bb6a !important;
            color: white !important;
            font-weight: 700;
            width: 100%;
            border: none !important;
            transition: background-color 0.2s, transform 0.1s !important;
        }

        .btn-back:hover {
            background-color: #4caf50 !important;
            transform: translateY(-2px);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .logout-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">FlashCard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">홈</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="card_deck.html">콘텐츠 선택</a>
                        </li>
                    <li class="nav-item">
                        <a class="nav-link" href="flash_card.html">단어 학습하기</a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link" href="kanji_deck.html">한자 학습하기</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="flash_card.html?mode=wrong">오답 노트</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">로그인</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="logout.html">로그아웃</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="logout-container">
        <div class="logout-card">
            <span class="logout-icon"> </span>
            <h1>Flash Card</h1>
            <p>안전하게 로그아웃 되었습니다.<br>학습하시느라 고생 많으셨어요!</p>

            <div class="button-group">
                <button type="button" class="btn-back" onclick="location.href='login.html'">로그인 페이지로 돌아가기</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

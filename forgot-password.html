<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기 - Flash Card</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-card">
            <h1>비밀번호 찾기</h1>
            <p class="auth-sub">가입하신 이메일을 입력하시면<br>비밀번호 재설정 링크를 보내드립니다.</p>

            <form id="forgotForm" onsubmit="return handleForgot(event)">
                <div class="auth-form-group">
                    <label for="userEmail">이메일</label>
                    <input type="email" id="userEmail" name="userEmail" class="auth-input" placeholder="example@email.com" required>
                </div>

                <div class="auth-button-group">
                    <button type="submit" class="auth-btn auth-btn-primary">재설정 링크 보내기</button>
                </div>

                <div class="auth-error-container">
                    <div id="resultMessage" class="auth-error-msg"></div>
                </div>
            </form>

            <div class="auth-footer-links">
                <a href="login.html">로그인으로 돌아가기</a>
            </div>
        </div>
    </div>

    <script>
        function handleForgot(event) {
            event.preventDefault();

            const email = document.getElementById('userEmail').value;
            const resultDiv = document.getElementById('resultMessage');

            // 데모용 로직 (실제 구현 시 서버 API 호출 필요)
            if (email.includes('@')) {
                resultDiv.textContent = '비밀번호 재설정 링크를 보냈습니다. (데모)';
                resultDiv.style.cssText = 'display:block; color:#2e7d32; background-color:#e8f5e9; border-color:#c8e6c9;';
            } else {
                resultDiv.textContent = '올바른 이메일 형식이 아닙니다.';
                resultDiv.style.display = 'block';
            }

            return false;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

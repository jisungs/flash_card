<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - Flash Card</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-card">
            <h1>Flash Card</h1>
            <p class="auth-sub">다시 만나서 반가워요! 로그인 해주세요.</p>

            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="auth-form-group">
                    <label for="userId">아이디</label>
                    <input type="text" id="userId" name="userId" class="auth-input" placeholder="아이디를 입력하세요" required>
                </div>

                <div class="auth-form-group">
                    <label for="userPassword">비밀번호</label>
                    <input type="password" id="userPassword" name="userPassword" class="auth-input" placeholder="비밀번호를 입력하세요" required>
                </div>

                <div class="auth-button-group">
                    <button type="submit" class="auth-btn auth-btn-primary">로그인</button>
                    <button type="button" class="auth-btn auth-btn-secondary" onclick="location.href='sign_up.html'">회원가입</button>
                </div>

                <div class="auth-error-container">
                    <div id="errorMessage" class="auth-error-msg"></div>
                </div>
            </form>

            <div class="auth-footer-links">
                <a href="forgot-password.html">비밀번호를 잊으셨나요?</a>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();

            const userId = document.getElementById('userId').value;
            const password = document.getElementById('userPassword').value;
            const errorDiv = document.getElementById('errorMessage');

            // 데모용 로그인 로직 (실제 구현 시 서버 API 호출 필요)
            if (userId === 'admin' && password === '1234') {
                alert('로그인 성공!');
                window.location.href = 'index.html';
            } else {
                // 로그인 실패 처리
                errorDiv.textContent = '아이디 또는 비밀번호가 일치하지 않습니다.';
                errorDiv.style.display = 'block';

                // 3초 후 경고창 숨기기 (선택 사항)
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 3000);
            }

            return false;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

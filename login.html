<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - Flash Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* 로그인 페이지 전용 스타일 */
        body {
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            animation: fadeInUp 0.6s ease-out;
        }

        .login-card {
            background-color: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            border: 2px solid #c8e6c9;
        }

        .login-card h1 {
            margin-top: 0;
            font-size: 2rem;
            font-weight: 800;
            color: #66bb6a;
            margin-bottom: 10px;
        }

        .login-card p {
            color: #888;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            margin-left: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 12px;
            box-sizing: border-box;
            transition: all 0.2s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: #66bb6a;
            box-shadow: 0 0 0 3px rgba(102, 187, 106, 0.2);
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 30px;
        }

        .btn-login {
            background-color: #66bb6a !important;
            color: white !important;
            font-weight: 700;
            width: 100%;
            border: none !important;
            transition: background-color 0.2s, transform 0.1s !important;
        }

        .btn-login:hover {
            background-color: #4caf50 !important;
            transform: translateY(-2px);
        }

        .btn-signup {
            background-color: #a5d6a7 !important;
            color: #2e7d32 !important;
            font-weight: 600;
            width: 100%;
            border: none !important;
        }

        .btn-signup:hover {
            background-color: #81c784 !important;
        }

        /* 경고창 스타일 */
        .error-container {
            margin-top: 20px;
            min-height: 24px;
        }

        .error-message {
            color: #e53935;
            background-color: #ffebee;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid #ffcdd2;
            display: none; /* 기본적으로 숨김 */
            animation: shake 0.4s ease-in-out;
        }

        .footer-links {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #999;
        }

        .footer-links a {
            color: #66bb6a;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: #4caf50;
            text-decoration: underline;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->

    <div class="login-container">
        <div class="login-card">
            <h1>Flash Card</h1>
            <p>다시 만나서 반가워요! 로그인 해주세요.</p>

            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="input-group">
                    <label for="userId">아이디</label>
                    <input type="text" id="userId" name="userId" placeholder="아이디를 입력하세요" required>
                </div>

                <div class="input-group">
                    <label for="userPassword">비밀번호</label>
                    <input type="password" id="userPassword" name="userPassword" placeholder="비밀번호를 입력하세요" required>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-login">로그인</button>
                    <button type="button" class="btn-signup" onclick="location.href='signup.html'">회원가입</button>
                </div>

                <div class="error-container">
                    <div id="errorMessage" class="error-message"></div>
                </div>
            </form>

            <div class="footer-links">
                <a href="forgot-password.html">비밀번호를 잊으셨나요?</a>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();

            const userId = document.getElementById('userId').value;
            const password = document.getElementById('userPassword').value;
            const errorDiv = document.getElementById('errorMessage');

            // 데모용 로그인 로직 (실제 구현 시 서버 API 호출 필요)
            if (userId === 'admin' && password === '1234') {
                alert('로그인 성공!');
                window.location.href = 'index.html';
            } else {
                // 로그인 실패 처리
                errorDiv.textContent = '아이디 또는 비밀번호가 일치하지 않습니다.';
                errorDiv.style.display = 'block';

                // 3초 후 경고창 숨기기 (선택 사항)
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 3000);
            }

            return false;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Bootstrap 5 CSS 연결 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="statics/styles.css" />
    </head>
    <body>
        <!-- Navigation Bar -->
        <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
            <div class="container">
                <a class="navbar-brand" href="index.html">FlashCard</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link " href="index.html">홈</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="card_deck.html">콘텐츠 선택</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="flash_card.html">단어 학습하기</a>
                        </li>
                         <li class="nav-item">
                            <a class="nav-link" href="kanji_deck.html">한자 학습하기</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="dashboard.html">학습 대시보드</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="flash_card.html?mode=wrong">오답 노트</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="sign_up.html">회원가입</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="login.html">로그인</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="logout.html">로그아웃</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <main id="main-content">
            <section id="study" class="content-section">
                <h1 class="section-title">Flash Cards</h1>
                <div id="flashcard-container">
                    <div class="flashcard">
                        <div class="front"></div>
                        <div class="back">
                            <div class="back-text"></div>
                            <div class="overlay-controls">
                                <button class="control-btn correct-btn">
                                    <img src="images/check_btn-removebg.png" alt="Correct" />
                                </button>
                                <button class="control-btn incorrect-btn">
                                    <img src="images/false_btn-removebg.png" alt="Incorrect" />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="progress-wrapper">
                    <div class="progress-container">
                        <div id="progress-bar"></div>
                    </div>
                    <span id="progress">0 / 0</span>
                </div>
                <div class="controls">
                    <button id="shuffle-btn">Shuffle</button>
                    <button id="prev-btn">Previous</button>
                    <button id="next-btn">Next</button>
                </div>
            </section>
        </main>

        <div id="completion-modal" class="modal">
            <div class="modal-content">
                <h2>🎉 학습 완료!</h2>
                <p id="completion-message"></p>
                <button id="close-modal">다시 학습하기</button>
            </div>
        </div>
        <script src="statics/utils.js"></script>
        <script src="statics/storage.js"></script>
        <script src="statics/learning.js"></script>
        <!-- Bootstrap 5 JS 연결 (햄버거 메뉴 작동 필수) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
